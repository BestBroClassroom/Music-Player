<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Source Audio Player (v5)</title>
<style>
:root{
  --bg:#1c1830;
  --sf:#272142;
  --sf2:#312952;
  --ln:#3a3260;
  --tx:#f3effa;
  --mu:#a79fc4;
  --ac:#ffb347;
  --ac-tx:#201400;
}
*{box-sizing:border-box;margin:0}
body{
  font:15px/1.45 system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--tx);
  padding:20px 16px 44px;
}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:800px;margin:auto}

/* Search & Settings Bar */
#f{display:flex;gap:8px;margin-bottom:12px}
#q,#g-key,#g-cx{
  flex:1;min-width:0;
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:10px;
  padding:11px 14px;
  color:var(--tx);
  font:inherit;
}
#q::placeholder,#g-key::placeholder,#g-cx::placeholder{color:var(--mu)}
#f button[type="submit"],#save-set{
  background:var(--ac);
  color:var(--ac-tx);
  border-radius:10px;
  padding:11px 18px;
  font-weight:600;
}
#gear{
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:10px;
  padding:0 13px;
  color:var(--mu);
}
#gear:hover{color:var(--tx)}
#set{
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  display:grid;
  gap:10px;
}
#set[hidden]{display:none}
.set-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
@media(max-width:640px){.set-grid{grid-template-columns:1fr}}
#set small{color:var(--mu);font-size:12.5px;line-height:1.45}

/* Source Switcher */
.sources{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-bottom:14px;
}
.src-btn{
  padding:7px 14px;
  border-radius:999px;
  background:var(--sf);
  border:1px solid var(--ln);
  color:var(--mu);
  font-size:13px;
  font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.src-btn:hover{color:var(--tx)}
.src-btn.on{
  background:var(--ac);
  color:var(--ac-tx);
  border-color:var(--ac);
}
.src-tag{
  font-size:10px;
  padding:1px 6px;
  border-radius:999px;
  background:rgba(0,0,0,.22);
}

/* Now Playing Deck */
#deck{
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  display:flex;
  gap:20px;
  align-items:center;
}
#deck[hidden]{display:none}
@media(max-width:620px){
  #deck{flex-direction:column;text-align:center}
}
#art{
  width:176px;height:176px;flex:none;
  border-radius:12px;
  object-fit:cover;
  background:#141024;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.info{flex:1;min-width:0;width:100%}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(max-width:620px){.topline{justify-content:center}}
.badge{
  color:var(--ac);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:11px;
}
.pill-meta{
  font-size:11px;
  color:var(--mu);
  background:var(--bg);
  padding:2px 9px;
  border-radius:999px;
}
#tt{
  font:700 23px/1.2 Georgia,serif;
  overflow-wrap:anywhere;
  margin:5px 0 3px;
}
#mt{color:var(--mu);font-size:14px}

/* Scrubber & Transport (Audius + SoundCloud) */
#native-ctl[hidden]{display:none}
.scrub{
  display:flex;align-items:center;gap:10px;
  margin-top:15px;
  font-size:12px;color:var(--mu);
  font-variant-numeric:tabular-nums;
}
.bar-wrap{
  position:relative;flex:1;height:18px;
  display:flex;align-items:center;
}
.bar-bg,.bar-buf,.bar-fill{
  position:absolute;left:0;height:5px;border-radius:999px;pointer-events:none;
}
.bar-bg{width:100%;background:var(--bg)}
.bar-buf{width:0%;background:var(--ln)}
.bar-fill{width:0%;background:var(--ac)}
#seek{
  position:relative;width:100%;margin:0;
  background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;
}
#seek::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--ac);border:2px solid var(--tx);
}
#seek::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--ac);border:2px solid var(--tx);
}
.ctl{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:13px;
}
@media(max-width:620px){.ctl{justify-content:center;flex-wrap:wrap}}
.btns{display:flex;align-items:center;gap:8px}
.btns button,#mut{
  width:38px;height:38px;border-radius:50%;
  font-size:15px;background:var(--bg);color:var(--tx);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.btns button:hover,#mut:hover{background:var(--sf2)}
.btns button.on{color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
#pp{
  width:48px;height:48px;font-size:18px;
  background:var(--ac)!important;color:var(--ac-tx)!important;
}
.volbox{display:flex;align-items:center;gap:6px}
#vol{width:84px;accent-color:var(--ac);cursor:pointer}

/* audio.com Embedded Player */
#ac-embed-wrap{margin-top:14px;border-radius:12px;overflow:hidden;background:#141024}
#ac-embed-wrap[hidden]{display:none}
#ac-frame{width:100%;height:152px;border:0;display:block}
#ext-link{
  display:inline-block;margin:8px 10px;font-size:12.5px;
  color:var(--ac);text-decoration:none;
}
#ext-link:hover{text-decoration:underline}

/* Offscreen SoundCloud Widget Iframe */
#sc-hidden{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}

/* Status, Sub-tabs, Genre Pills & Track List */
#st{color:var(--mu);font-size:13px;min-height:1.3em;margin-bottom:8px}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--ln);
  margin-bottom:10px;padding-bottom:6px;
}
nav{display:flex;gap:4px}
nav button{
  padding:6px 12px;color:var(--mu);
  border-bottom:2px solid transparent;font-weight:600;
}
nav button.on{color:var(--tx);border-color:var(--ac)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pills[hidden]{display:none}
.pill{
  font-size:12px;padding:5px 11px;border-radius:999px;
  background:var(--sf);color:var(--mu);border:1px solid var(--ln);
}
.pill:hover{color:var(--tx)}
.pill.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac);font-weight:600}

.row{
  display:flex;gap:12px;align-items:center;
  padding:8px 10px;border-radius:10px;cursor:pointer;
  transition:background .12s;
}
.row:hover,.row.active{background:var(--sf)}
.row.active b{color:var(--ac)}
.row img{
  width:48px;height:48px;object-fit:cover;
  border-radius:8px;flex:none;background:#141024;
}
.row .meta{min-width:0;flex:1}
.row b{
  display:block;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dur{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.verified{color:var(--ac);font-size:12px;margin-left:3px}
.msg{color:var(--mu);padding:22px 6px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <form id="f">
    <input id="q" placeholder="Search songs/artists, or paste a SoundCloud / audio.com URL… (v5)" autocomplete="off" autofocus>
    <button type="submit">Search</button>
    <button type="button" id="gear" title="Search Settings" aria-label="Search Settings">⚙</button>
  </form>

  <div id="set" hidden>
    <div class="set-grid">
      <input id="g-key" type="password" placeholder="Optional: Google Custom Search API Key" autocomplete="off">
      <input id="g-cx" type="text" placeholder="Optional: Google Search Engine ID (cx)" autocomplete="off">
      <button type="button" id="save-set">Save</button>
    </div>
    <small>
      Works keyless out of the box. For official Google Custom Search JSON results on <code>site:soundcloud.com</code> and <code>site:audio.com</code> (100 free searches/day), add a Google API Key and Programmable Search Engine ID (<code>cx</code>).
    </small>
  </div>

  <div class="sources" role="tablist" aria-label="Streaming Source">
    <button type="button" class="src-btn on" data-src="audius">Audius <span class="src-tag">Native Audio</span></button>
    <button type="button" class="src-btn" data-src="soundcloud">SoundCloud <span class="src-tag">URL Filter · No 30s</span></button>
    <button type="button" class="src-btn" data-src="audiocom">audio.com <span class="src-tag">URL Filter</span></button>
  </div>

  <div id="deck" hidden>
    <img id="art" alt="Cover art">
    <div class="info">
      <div class="topline">
        <span class="badge" id="badge">Now playing</span>
        <span class="pill-meta" id="src-pill">Audius</span>
      </div>
      <h1 id="tt"></h1>
      <p id="mt"></p>

      <div id="native-ctl">
        <div class="scrub">
          <span id="t0">0:00</span>
          <div class="bar-wrap">
            <div class="bar-bg"></div>
            <div class="bar-buf" id="buf"></div>
            <div class="bar-fill" id="fill"></div>
            <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
          </div>
          <span id="t1">0:00</span>
        </div>

        <div class="ctl">
          <div class="btns">
            <button id="shuf" title="Shuffle" aria-label="Toggle shuffle">🔀</button>
            <button id="pv" title="Previous" aria-label="Previous">⏮</button>
            <button id="pp" title="Play or pause" aria-label="Play or pause">▶</button>
            <button id="nt" title="Next" aria-label="Next">⏭</button>
            <button id="rep" title="Repeat: Off" aria-label="Cycle repeat mode">🔁</button>
          </div>
          <div class="volbox">
            <button id="mut" title="Mute" aria-label="Mute or unmute">🔊</button>
            <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
          </div>
        </div>
      </div>

      <div id="ac-embed-wrap" hidden>
        <iframe id="ac-frame" allow="autoplay"></iframe>
        <a id="ext-link" href="#" target="_blank" rel="noopener" hidden>Open track page ↗</a>
      </div>
    </div>
  </div>

  <div id="st"></div>

  <div class="toolbar" id="audius-bar">
    <nav>
      <button type="button" data-tab="trend" class="on">Trending</button>
      <button type="button" data-tab="search">Results</button>
    </nav>
  </div>

  <div class="pills" id="genres"></div>
  <div id="ls"></div>
</div>

<audio id="aud" preload="auto"></audio>
<div id="sc-hidden">
  <iframe id="sc-frame" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&auto_play=false"></iframe>
</div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
const APP_NAME='MultiSourceAudioPlayerV5';
const GENRES=['All','Electronic','Hip-Hop/Rap','Pop','Rock','Lo-Fi','R&B/Soul','House'];

const $=s=>document.querySelector(s);
const LS={
  get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch{}}
};

/* ---- State ---- */
let source='audius';
let audiusHosts=['https://api.audius.co'];
let audiusHostIdx=0;
let audiusTab='trend';
let activeGenre='All';
let trendTracks=[];
let audiusSearchTracks=[];
let scTracks=[];
let acTracks=[];

let queue=[];
let idx=-1;
let activeEngine=null;
let drag=false;
let shuffle=false;
let repeat=0;
let streamRetries=0;

let googleKey=LS.get('g_key','');
let googleCx=LS.get('g_cx','');
$('#g-key').value=googleKey;
$('#g-cx').value=googleCx;

let scWidget=null;
let scReady=false;
let scDurationSec=0;
let scPaused=true;

const aud=$('#aud');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Number.isFinite(s)&&s>=0?(s/60|0)+':'+String(s%60|0).padStart(2,'0'):'0:00';
const fmtPlays=n=>!n?'':n>=1e6?(n/1e6).toFixed(1)+'M plays':n>=1e3?(n/1e3).toFixed(1)+'K plays':n+' plays';
const humanizeSlug=s=>decodeURIComponent(s||'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim();

/* ---- Fallback SVG Artwork ---- */
function fallbackArt(title,artist){
  const label=(title||'?').trim().slice(0,2).toUpperCase();
  let hash=0;
  for(const ch of (title+artist))hash=(hash*31+ch.charCodeAt(0))|0;
  const hue=Math.abs(hash)%360;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(${hue},55%,28%)"/>
      <stop offset="100%" stop-color="hsl(${(hue+45)%360},60%,16%)"/>
    </linearGradient></defs>
    <rect width="480" height="480" fill="url(#g)"/>
    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
      fill="#f3effa" font-family="Georgia,serif" font-size="140" font-weight="700">${esc(label)}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* =========================================================================
   SEARCH-ENGINE URL COLLECTOR (Google CSE -> Google / Bing / Brave Readers)
   ========================================================================= */
async function fetchReaderText(targetUrl){
  const r=await fetch(`https://r.jina.ai/${targetUrl}`,{
    headers:{Accept:'text/plain'},
    signal:AbortSignal.timeout(12000)
  });
  if(!r.ok)throw Error('Reader HTTP '+r.status);
  return await r.text();
}

async function searchWebForUrls(siteDomain,query){
  const fullQuery=`site:${siteDomain} ${query}`;
  const candidates=[];

  // 1. Official Google Custom Search JSON API (if user configured key + cx in Settings)
  if(googleKey&&googleCx){
    $('#st').textContent=`Searching Google API for ${siteDomain}…`;
    const u=new URL('https://www.googleapis.com/customsearch/v1');
    u.search=new URLSearchParams({key:googleKey,cx:googleCx,q:fullQuery,num:'10'});
    const r=await fetch(u,{signal:AbortSignal.timeout(8000)});
    const d=await r.json();
    if(!r.ok)throw Error(d.error?.message||'Google Search API error '+r.status);
    for(const item of (d.items||[])){
      candidates.push({
        url:item.link||'',
        rawTitle:item.title||'',
        thumb:item.pagemap?.cse_thumbnail?.[0]?.src||item.pagemap?.metatags?.[0]?.['og:image']||''
      });
    }
    return candidates;
  }

  // 2. Keyless Web Index Search (sequential: Google -> Bing -> Brave via CORS-open reader)
  const engines=[
    {name:'Google',url:`https://www.google.com/search?q=${encodeURIComponent(fullQuery)}&num=20`},
    {name:'Bing',url:`https://www.bing.com/search?q=${encodeURIComponent(fullQuery)}&count=20`},
    {name:'Brave',url:`https://search.brave.com/search?q=${encodeURIComponent(fullQuery)}`}
  ];

  for(const eng of engines){
    $('#st').textContent=`Searching ${eng.name} for ${siteDomain} URLs…`;
    try{
      const text=await fetchReaderText(eng.url);
      if(!text||text.includes('unusual traffic')||text.includes('solve the captcha'))continue;

      // Extract markdown links: [Title](https://...)
      const mdRx=/\[((?:[^\[\]]|\[[^\]]*\])*)\]\((https?:\/\/[^\s)]+)\)/g;
      let m;
      while((m=mdRx.exec(text))!==null){
        const title=m[1].replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
        candidates.push({url:m[2],rawTitle:title,thumb:''});
      }

      // Also extract bare URLs in case a search engine outputs plain links
      const bareRx=/https?:\/\/(?:www\.|m\.)?(?:soundcloud\.com|audio\.com)\/[^\s)"'<>]+/g;
      while((m=bareRx.exec(text))!==null){
        candidates.push({url:m[0],rawTitle:'',thumb:''});
      }

      if(candidates.some(c=>c.url.includes(siteDomain)))break;
    }catch{}
  }

  return candidates;
}

/* =========================================================================
   1. AUDIUS ENGINE (Native <audio>)
   ========================================================================= */
(async function discoverAudiusHosts(){
  try{
    const r=await fetch('https://api.audius.co',{signal:AbortSignal.timeout(5000)});
    if(!r.ok)return;
    const d=await r.json();
    if(Array.isArray(d.data)&&d.data.length){
      audiusHosts=[...new Set(['https://api.audius.co',...d.data])];
    }
  }catch{}
})();

async function audiusGet(path){
  let lastErr;
  for(let attempt=0;attempt<Math.min(audiusHosts.length,4);attempt++){
    const base=audiusHosts[(audiusHostIdx+attempt)%audiusHosts.length];
    const sep=path.includes('?')?'&':'?';
    try{
      const r=await fetch(`${base}${path}${sep}app_name=${APP_NAME}`,{signal:AbortSignal.timeout(8000)});
      if(!r.ok)throw Error(`HTTP ${r.status}`);
      const json=await r.json();
      audiusHostIdx=(audiusHostIdx+attempt)%audiusHosts.length;
      return json.data||[];
    }catch(err){
      lastErr=err;
    }
  }
  throw lastErr||Error('Could not reach Audius.');
}

function mapAudiusTrack(t){
  const title=t.title||'Untitled';
  const artist=t.user?.name||'Unknown Artist';
  const fb=fallbackArt(title,artist);
  return{
    engine:'audius',
    id:t.id,
    title,
    artist,
    verified:Boolean(t.user?.is_verified),
    meta:t.genre||'',
    plays:t.play_count||0,
    duration:t.duration||0,
    thumbSm:t.artwork?.['150x150']||t.artwork?.['480x480']||fb,
    thumbLg:t.artwork?.['480x480']||t.artwork?.['1000x1000']||t.artwork?.['150x150']||fb,
    fallback:fb
  };
}

const isAudiusPlayable=t=>t&&t.id&&t.is_streamable!==false&&!t.is_stream_gated;
const audiusStreamUrl=(id,h=audiusHostIdx)=>`${audiusHosts[h%audiusHosts.length]}/v1/tracks/${encodeURIComponent(id)}/stream?app_name=${APP_NAME}`;

async function loadAudiusTrending(genre='All'){
  activeGenre=genre;
  renderSubControls();
  $('#st').textContent=genre==='All'?'Loading Audius trending tracks…':`Loading Audius ${genre}…`;
  try{
    const q=genre==='All'?'/v1/tracks/trending?limit=25':`/v1/tracks/trending?genre=${encodeURIComponent(genre)}&limit=25`;
    const raw=await audiusGet(q);
    trendTracks=raw.filter(isAudiusPlayable).map(mapAudiusTrack);
    if(source==='audius'&&audiusTab==='trend')renderList();
    $('#st').textContent=trendTracks.length?'':'No trending tracks found.';
  }catch(err){
    $('#st').textContent='Audius error: '+err.message;
  }
}

async function searchAudius(q){
  audiusTab='search';
  renderSubControls();
  $('#st').textContent='Searching Audius…';
  const raw=await audiusGet(`/v1/tracks/search?query=${encodeURIComponent(q)}&limit=25`);
  audiusSearchTracks=raw.filter(isAudiusPlayable).map(mapAudiusTrack);
  renderList();
  $('#st').textContent=audiusSearchTracks.length?'':`No Audius tracks found for "${q}".`;
  if(audiusSearchTracks.length)playTrack(0);
}

/* =========================================================================
   2. SOUNDCLOUD ENGINE (Search-Engine URL Filter + Full Tracks Only)
   ========================================================================= */
const SC_BAD_OWNER=new Set([
  'discover','stream','upload','search','charts','stations','tags','you','pages',
  'jobs','press','blog','mobile','pro','go','creators','artists','people',
  'terms-of-use','privacy','imprint','cookie-policy','community-guidelines','popular'
]);
const SC_BAD_SLUG=new Set([
  'sets','likes','reposts','following','followers','tracks','albums',
  'popular-tracks','comments','recommended','related'
]);

function filterSoundCloudTrackUrls(candidates){
  const out=[];
  const seen=new Set();

  for(const item of candidates){
    const m=(item.url||'').match(/https?:\/\/(?:www\.|m\.)?soundcloud\.com\/([a-zA-Z0-9_-]+)\/([a-zA-Z0-9_-]+)(?:[/?#]|$)/i);
    if(!m)continue;
    const owner=m[1].toLowerCase();
    const slug=m[2].toLowerCase();
    if(SC_BAD_OWNER.has(owner)||SC_BAD_SLUG.has(slug))continue;

    const cleanUrl=`https://soundcloud.com/${m[1]}/${m[2]}`;
    if(seen.has(cleanUrl))continue;
    seen.add(cleanUrl);

    // Clean search engine titles like "Stream Song Name by Artist | Listen online..."
    let cleanTitle=(item.rawTitle||'')
      .replace(/^Stream\s+/i,'')
      .replace(/\s*\|\s*Listen online.*$/i,'')
      .replace(/\s*\|\s*SoundCloud.*$/i,'')
      .trim();

    let title=cleanTitle||humanizeSlug(m[2]);
    let artist=humanizeSlug(m[1]);
    const byMatch=cleanTitle.match(/^(.+?)\s+by\s+(.+)$/i);
    if(byMatch){
      title=byMatch[1].trim();
      artist=byMatch[2].trim();
    }

    const fb=fallbackArt(title,artist);
    out.push({
      engine:'soundcloud',
      id:cleanUrl,
      permalinkUrl:cleanUrl,
      title,
      artist,
      verified:false,
      meta:'SoundCloud URL',
      plays:0,
      duration:0,
      thumbSm:item.thumb||fb,
      thumbLg:item.thumb||fb,
      fallback:fb,
      isPreview:false
    });
    if(out.length>=20)break;
  }
  return out;
}

async function searchSoundCloud(q){
  const rawCandidates=await searchWebForUrls('soundcloud.com',q);
  scTracks=filterSoundCloudTrackUrls(rawCandidates);
  renderList();

  if(!scTracks.length){
    $('#st').textContent=`No direct SoundCloud track URLs found for "${q}". Try adding a free Google Search API key in ⚙ or pasting a SoundCloud link.`;
    return;
  }
  $('#st').textContent=`Found ${scTracks.length} SoundCloud track URLs (30s Go+ previews auto-skipped on load).`;
  playTrack(0);
}

/* =========================================================================
   3. AUDIO.COM ENGINE (Search-Engine URL Filter + Embed Player)
   ========================================================================= */
const AC_BAD_OWNER=new Set([
  'search','explore','collections','public-api','login','signup','embed',
  'api','oauth','static','assets','terms','privacy','blog','help','about'
]);

function filterAudioComTrackUrls(candidates){
  const out=[];
  const seen=new Set();

  for(const item of candidates){
    const rawUrl=item.url||'';
    // Match https://audio.com/{user}/audio/{slug}
    const slugMatch=rawUrl.match(/https?:\/\/(?:www\.)?audio\.com\/([a-zA-Z0-9._-]+)\/audio\/([a-zA-Z0-9._-]+)/i);
    // Match https://audio.com/audio/{numericId} or /embed/audio/{numericId}
    const idMatch=rawUrl.match(/https?:\/\/(?:www\.)?audio\.com\/(?:audio|embed\/audio)\/(\d{6,20})/i);

    let cleanUrl='',numericId='',owner='',slug='';
    if(slugMatch){
      owner=slugMatch[1];
      slug=slugMatch[2];
      if(AC_BAD_OWNER.has(owner.toLowerCase()))continue;
      cleanUrl=`https://audio.com/${owner}/audio/${slug}`;
    }else if(idMatch){
      numericId=idMatch[1];
      cleanUrl=`https://audio.com/audio/${numericId}`;
    }else{
      continue;
    }

    if(seen.has(cleanUrl))continue;
    seen.add(cleanUrl);

    let cleanTitle=(item.rawTitle||'')
      .replace(/\s*[\|\-–]\s*audio\.com.*$/i,'')
      .trim();

    let title=cleanTitle||(slug?humanizeSlug(slug):`audio.com Track (${numericId})`);
    let artist=owner?humanizeSlug(owner):'audio.com Creator';
    const byMatch=cleanTitle.match(/^(.+?)\s+by\s+(.+)$/i);
    if(byMatch){
      title=byMatch[1].trim();
      artist=byMatch[2].trim();
    }

    const fb=fallbackArt(title,artist);
    out.push({
      engine:'audiocom',
      id:cleanUrl,
      numericId,
      pageUrl:cleanUrl,
      embedUrl:numericId?`https://audio.com/embed/audio/${numericId}?theme=image&autoplay=1`:'',
      title,
      artist,
      verified:false,
      meta:'audio.com URL',
      plays:0,
      duration:0,
      thumbSm:item.thumb||fb,
      thumbLg:item.thumb||fb,
      fallback:fb
    });
    if(out.length>=20)break;
  }
  return out;
}

async function resolveAudioComEmbed(track){
  if(track.embedUrl)return track.embedUrl;
  if(!track.pageUrl)return '';

  const oembedUrl=`https://audio.com/oembed?url=${encodeURIComponent(track.pageUrl)}&format=json`;
  try{
    const txt=await fetchReaderText(oembedUrl);
    const jsonMatch=txt.match(/\{[\s\S]*\}/);
    if(jsonMatch){
      const data=JSON.parse(jsonMatch[0]);
      const srcMatch=(data?.html||'').match(/src=["']([^"']*audio\.com\/embed\/audio\/[^"']+)["']/i);
      if(srcMatch){
        const u=new URL(srcMatch[1]);
        u.searchParams.set('autoplay','1');
        track.embedUrl=u.toString();
        if(data.title)track.title=data.title;
        if(data.author_name)track.artist=data.author_name;
        if(data.thumbnail_url){track.thumbSm=data.thumbnail_url;track.thumbLg=data.thumbnail_url;}
        return track.embedUrl;
      }
    }
  }catch{}

  try{
    const pageText=await fetchReaderText(track.pageUrl);
    const idMatch=pageText.match(/audio\.com\/embed\/audio\/(\d{6,20})/);
    if(idMatch){
      track.numericId=idMatch[1];
      track.embedUrl=`https://audio.com/embed/audio/${idMatch[1]}?theme=image&autoplay=1`;
      return track.embedUrl;
    }
  }catch{}

  return '';
}

async function searchAudioCom(q){
  const rawCandidates=await searchWebForUrls('audio.com',q);
  acTracks=filterAudioComTrackUrls(rawCandidates);
  renderList();

  if(!acTracks.length){
    $('#st').textContent=`No direct audio.com track URLs found for "${q}". Try adding a free Google Search API key in ⚙ or pasting an audio.com link.`;
    return;
  }
  $('#st').textContent=`Found ${acTracks.length} audio.com track URLs.`;
  playTrack(0);
}

/* =========================================================================
   4. UNIFIED PLAYBACK & 30s SOUNDCLOUD PREVIEW GUARD
   ========================================================================= */
function initSoundCloudWidget(){
  if(!window.SC||!window.SC.Widget)return;
  scWidget=window.SC.Widget($('#sc-frame'));
  scWidget.bind(window.SC.Widget.Events.READY,()=>{scReady=true;});
  scWidget.bind(window.SC.Widget.Events.PLAY,()=>{
    if(activeEngine!=='soundcloud')return;
    scPaused=false;
    $('#pp').textContent='⏸';
    $('#badge').textContent='Now playing';

    scWidget.getDuration(ms=>{
      const sec=Math.round((ms||0)/1000);
      // Exclude 30-second Go+ previews automatically
      if(sec>0&&sec<=30){
        try{scWidget.pause();}catch{}
        const skippedTitle=queue[idx]?.title||'Track';
        if(queue[idx]){
          queue[idx].isPreview=true;
          queue[idx].meta='30s Go+ Preview (Excluded)';
          queue[idx].duration=sec;
        }
        renderList();
        $('#st').textContent=`Excluded "${skippedTitle}" (30-second Go+ preview) — skipping to next full track…`;
        const nextFullIdx=queue.findIndex((t,i)=>i>idx&&!t.isPreview);
        if(nextFullIdx>=0)playTrack(nextFullIdx);
        else{
          $('#badge').textContent='No full tracks left';
          $('#pp').textContent='▶';
        }
        return;
      }

      scDurationSec=sec;
      if(scDurationSec&&queue[idx]){
        queue[idx].duration=scDurationSec;
        queue[idx].meta='Full Track';
        $('#t1').textContent=fmt(scDurationSec);
        renderList();
      }
    });
  });
  scWidget.bind(window.SC.Widget.Events.PAUSE,()=>{
    if(activeEngine!=='soundcloud')return;
    scPaused=true;
    $('#pp').textContent='▶';
    $('#badge').textContent='Paused';
  });
  scWidget.bind(window.SC.Widget.Events.FINISH,()=>{
    if(activeEngine==='soundcloud')nextTrack(true);
  });
  scWidget.bind(window.SC.Widget.Events.PLAY_PROGRESS,ev=>{
    if(activeEngine!=='soundcloud'||drag)return;
    const cur=(ev.currentPosition||0)/1000;
    const dur=scDurationSec||(queue[idx]?.duration||0);
    updateProgressUI(cur,dur);
    if(ev.loadedProgress)$('#buf').style.width=Math.min(100,ev.loadedProgress*100)+'%';
  });
}
initSoundCloudWidget();

function stopAllEngines(){
  aud.pause();
  aud.removeAttribute('src');
  if(scReady&&scWidget){
    try{scWidget.pause();}catch{}
  }
  $('#ac-frame').src='about:blank';
  $('#ext-link').hidden=true;
}

function getActiveList(){
  if(source==='audius')return audiusTab==='trend'?trendTracks:audiusSearchTracks;
  if(source==='soundcloud')return scTracks;
  return acTracks;
}

function updateProgressUI(cur,dur){
  const pct=dur>0?Math.min(100,Math.max(0,(cur/dur)*100)):0;
  $('#fill').style.width=pct+'%';
  if(!drag)$('#seek').value=Math.round(pct*10);
  $('#t0').textContent=fmt(cur);
  $('#t1').textContent=fmt(dur);
}

async function playTrack(i){
  const list=getActiveList();
  queue=list;
  if(i<0||i>=queue.length)return;
  idx=i;
  streamRetries=0;
  const t=queue[idx];
  activeEngine=t.engine;

  stopAllEngines();
  $('#deck').hidden=false;

  const art=$('#art');
  art.onerror=()=>{art.onerror=null;art.src=t.fallback;};
  art.src=t.thumbLg;

  $('#tt').textContent=t.title;
  $('#mt').innerHTML=`${esc(t.artist)}${t.verified?'<span class="verified">✓</span>':''}`;
  $('#src-pill').textContent=t.engine==='audius'?'Audius':t.engine==='soundcloud'?'SoundCloud · Full Track':'audio.com';
  $('#buf').style.width='0%';
  updateProgressUI(0,t.duration);
  document.title=`${t.title} · ${t.artist}`;
  renderList();

  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t.title,
      artist:t.artist,
      artwork:[{src:t.thumbLg}]
    });
  }

  if(t.engine==='audius'){
    $('#native-ctl').hidden=false;
    $('#ac-embed-wrap').hidden=true;
    $('#badge').textContent='Loading audio…';
    aud.src=audiusStreamUrl(t.id,audiusHostIdx);
    aud.load();
    aud.play().catch(()=>{$('#badge').textContent='Press ▶ to play';});
  }else if(t.engine==='soundcloud'){
    $('#native-ctl').hidden=false;
    $('#ac-embed-wrap').hidden=true;
    $('#badge').textContent='Loading SoundCloud…';
    scDurationSec=t.duration||0;
    if(scReady&&scWidget){
      scWidget.load(t.permalinkUrl,{
        auto_play:true,
        show_artwork:false,
        buying:false,
        sharing:false,
        download:false,
        show_comments:false
      });
      scWidget.setVolume(+$('#vol').value);
    }else{
      $('#sc-frame').src=`https://w.soundcloud.com/player/?url=${encodeURIComponent(t.permalinkUrl)}&auto_play=true`;
      setTimeout(initSoundCloudWidget,800);
    }
  }else if(t.engine==='audiocom'){
    $('#native-ctl').hidden=true;
    $('#ac-embed-wrap').hidden=false;
    $('#badge').textContent='Resolving audio.com embed…';
    const embed=await resolveAudioComEmbed(t);
    if(queue[idx]!==t)return;
    $('#tt').textContent=t.title;
    $('#mt').textContent=t.artist;
    art.src=t.thumbLg;
    renderList();

    if(embed){
      $('#badge').textContent='audio.com Player';
      $('#ac-frame').hidden=false;
      $('#ac-frame').src=embed;
    }else{
      $('#badge').textContent='External Track';
      $('#ac-frame').hidden=true;
    }
    if(t.pageUrl){
      const link=$('#ext-link');
      link.href=t.pageUrl;
      link.hidden=false;
    }
  }
}

function nextTrack(auto=false){
  if(!queue.length)return;
  if(auto&&repeat===2){
    if(activeEngine==='audius'){aud.currentTime=0;aud.play();}
    else if(activeEngine==='soundcloud'&&scWidget){scWidget.seekTo(0);scWidget.play();}
    return;
  }
  if(shuffle&&queue.length>1){
    let r=idx;
    while(r===idx)r=Math.floor(Math.random()*queue.length);
    playTrack(r);
    return;
  }
  if(idx+1<queue.length)playTrack(idx+1);
  else if(repeat===1)playTrack(0);
  else{$('#pp').textContent='▶';$('#badge').textContent='Finished';}
}

function prevTrack(){
  if(!queue.length)return;
  if(activeEngine==='audius'&&aud.currentTime>3){aud.currentTime=0;return;}
  if(activeEngine==='soundcloud'&&scWidget){
    scWidget.getPosition(ms=>{
      if(ms>3000)scWidget.seekTo(0);
      else if(idx>0)playTrack(idx-1);
    });
    return;
  }
  if(idx>0)playTrack(idx-1);
  else if(repeat===1)playTrack(queue.length-1);
}

/* ---- Native <audio> Events ---- */
aud.addEventListener('playing',()=>{
  if(activeEngine!=='audius')return;
  streamRetries=0;
  $('#pp').textContent='⏸';
  $('#badge').textContent='Now playing';
});
aud.addEventListener('pause',()=>{
  if(activeEngine!=='audius')return;
  $('#pp').textContent='▶';
  if(!aud.ended)$('#badge').textContent='Paused';
});
aud.addEventListener('waiting',()=>{
  if(activeEngine==='audius')$('#badge').textContent='Buffering…';
});
aud.addEventListener('ended',()=>{if(activeEngine==='audius')nextTrack(true);});
aud.addEventListener('timeupdate',()=>{
  if(activeEngine!=='audius'||drag)return;
  const dur=Number.isFinite(aud.duration)?aud.duration:(queue[idx]?.duration||0);
  updateProgressUI(aud.currentTime||0,dur);
});
aud.addEventListener('progress',()=>{
  if(activeEngine!=='audius')return;
  const dur=aud.duration;
  if(dur>0&&aud.buffered.length){
    const end=aud.buffered.end(aud.buffered.length-1);
    $('#buf').style.width=Math.min(100,(end/dur)*100)+'%';
  }
});
aud.addEventListener('error',()=>{
  if(activeEngine!=='audius')return;
  const t=queue[idx];
  if(!t)return;
  if(streamRetries<Math.min(audiusHosts.length-1,2)){
    streamRetries++;
    const nextHost=(audiusHostIdx+streamRetries)%audiusHosts.length;
    $('#badge').textContent='Switching node…';
    aud.src=audiusStreamUrl(t.id,nextHost);
    aud.play().catch(()=>{});
    return;
  }
  $('#badge').textContent='Stream error';
  $('#st').textContent=`Could not stream "${t.title}". Try another track.`;
});

/* ---- Transport, Scrubber & Volume ---- */
$('#pp').onclick=()=>{
  if(activeEngine==='audius'){
    aud.paused?aud.play():aud.pause();
  }else if(activeEngine==='soundcloud'&&scWidget){
    scPaused?scWidget.play():scWidget.pause();
  }
};
$('#nt').onclick=()=>nextTrack(false);
$('#pv').onclick=()=>prevTrack();

$('#shuf').onclick=()=>{
  shuffle=!shuffle;
  $('#shuf').classList.toggle('on',shuffle);
};
$('#rep').onclick=()=>{
  repeat=(repeat+1)%3;
  const btn=$('#rep');
  btn.classList.toggle('on',repeat>0);
  btn.textContent=repeat===2?'🔂':'🔁';
  btn.title=repeat===0?'Repeat: Off':repeat===1?'Repeat: All':'Repeat: One';
};

$('#seek').oninput=()=>{
  drag=true;
  const dur=activeEngine==='audius'
    ?(Number.isFinite(aud.duration)?aud.duration:(queue[idx]?.duration||0))
    :(scDurationSec||queue[idx]?.duration||0);
  const target=(+$('#seek').value/1000)*dur;
  $('#fill').style.width=(+$('#seek').value/10)+'%';
  $('#t0').textContent=fmt(target);
};
$('#seek').onchange=()=>{
  const pct=+$('#seek').value/1000;
  if(activeEngine==='audius'&&Number.isFinite(aud.duration)){
    aud.currentTime=pct*aud.duration;
  }else if(activeEngine==='soundcloud'&&scWidget){
    const dur=scDurationSec||queue[idx]?.duration||0;
    if(dur>0)scWidget.seekTo(pct*dur*1000);
  }
  drag=false;
};

const savedVol=Math.min(100,Math.max(0,+LS.get('vol',100)));
$('#vol').value=savedVol;
aud.volume=savedVol/100;
$('#mut').textContent=savedVol===0?'🔇':'🔊';

$('#vol').oninput=()=>{
  const v=+$('#vol').value;
  aud.muted=false;
  aud.volume=v/100;
  if(scReady&&scWidget)scWidget.setVolume(v);
  LS.set('vol',v);
  $('#mut').textContent=v===0?'🔇':'🔊';
};
$('#mut').onclick=()=>{
  aud.muted=!aud.muted;
  const muted=aud.muted||aud.volume===0;
  if(scReady&&scWidget)scWidget.setVolume(muted?0:+$('#vol').value);
  $('#mut').textContent=muted?'🔇':'🔊';
};

/* ---- Rendering ---- */
function renderSubControls(){
  document.querySelectorAll('.src-btn').forEach(b=>b.classList.toggle('on',b.dataset.src===source));
  $('#audius-bar').hidden=source!=='audius';
  document.querySelectorAll('#audius-bar nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===audiusTab));
  const genres=$('#genres');
  genres.hidden=!(source==='audius'&&audiusTab==='trend');
  genres.innerHTML=GENRES.map(g=>`<button type="button" class="pill${g===activeGenre?' on':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
}

function renderList(){
  const list=getActiveList();
  const currentId=queue[idx]?.id;
  if(!list.length){
    const hint=source==='audius'
      ?'Search Audius above or pick a trending genre.'
      :source==='soundcloud'
        ?'Search SoundCloud above (filters web results to direct track URLs only & skips 30s previews) or paste a SoundCloud link.'
        :'Search audio.com above (filters web results to direct track URLs only) or paste an audio.com link.';
    $('#ls').innerHTML=`<p class="msg">${hint}</p>`;
    return;
  }
  $('#ls').innerHTML=list.map((t,i)=>`
    <div class="row${t.id===currentId?' active':''}" data-i="${i}">
      <img src="${esc(t.thumbSm)}" onerror="this.onerror=null;this.src='${esc(t.fallback)}'" alt="">
      <div class="meta">
        <b>${esc(t.title)}</b>
        <small>${esc(t.artist)}${t.verified?'<span class="verified" title="Verified">✓</span>':''}${t.meta?' · '+esc(t.meta):''}${t.plays?' · '+fmtPlays(t.plays):''}</small>
      </div>
      <span class="dur">${t.duration?fmt(t.duration):''}</span>
    </div>
  `).join('');
}

/* ---- Direct URL Handler & Search Submit ---- */
function handleDirectUrl(url){
  if(/soundcloud\.com\//i.test(url)){
    const filtered=filterSoundCloudTrackUrls([{url,rawTitle:''}]);
    if(!filtered.length){
      $('#st').textContent='Please paste a direct SoundCloud track URL (e.g., https://soundcloud.com/artist/track).';
      return true;
    }
    source='soundcloud';
    scTracks=filtered;
    renderSubControls();
    renderList();
    $('#st').textContent='';
    playTrack(0);
    return true;
  }

  if(/audio\.com\//i.test(url)){
    const filtered=filterAudioComTrackUrls([{url,rawTitle:''}]);
    if(!filtered.length){
      $('#st').textContent='Please paste a direct audio.com track URL (e.g., https://audio.com/user/audio/track).';
      return true;
    }
    source='audiocom';
    acTracks=filtered;
    renderSubControls();
    renderList();
    $('#st').textContent='';
    playTrack(0);
    return true;
  }

  return false;
}

$('#f').onsubmit=async e=>{
  e.preventDefault();
  const q=$('#q').value.trim();
  if(!q)return;
  if(/^https?:\/\//i.test(q)&&handleDirectUrl(q))return;

  try{
    if(source==='audius')await searchAudius(q);
    else if(source==='soundcloud')await searchSoundCloud(q);
    else await searchAudioCom(q);
  }catch(err){
    $('#st').textContent=err?.message||'Search failed. Please try again.';
  }
};

document.querySelectorAll('.src-btn').forEach(b=>b.onclick=()=>{
  source=b.dataset.src;
  $('#st').textContent='';
  renderSubControls();
  renderList();
  const q=$('#q').value.trim();
  if(q&&!getActiveList().length)$('#f').requestSubmit();
});

document.querySelectorAll('#audius-bar nav button').forEach(b=>b.onclick=()=>{
  audiusTab=b.dataset.tab;
  renderSubControls();
  renderList();
});

$('#genres').onclick=e=>{
  const p=e.target.closest('.pill');
  if(p)loadAudiusTrending(p.dataset.g);
};

$('#ls').onclick=e=>{
  const r=e.target.closest('.row');
  if(r)playTrack(+r.dataset.i);
};

$('#gear').onclick=()=>$('#set').hidden=!$('#set').hidden;
$('#save-set').onclick=()=>{
  googleKey=$('#g-key').value.trim();
  googleCx=$('#g-cx').value.trim();
  LS.set('g_key',googleKey);
  LS.set('g_cx',googleCx);
  $('#set').hidden=true;
  $('#st').textContent=googleKey&&googleCx
    ?'Google Custom Search API saved.'
    :'Using keyless web search.';
};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'&&activeEngine!=='audiocom'){
    e.preventDefault();
    $('#pp').click();
  }else if(e.code==='ArrowRight'&&activeEngine==='audius'&&Number.isFinite(aud.duration)){
    aud.currentTime=Math.min(aud.duration,aud.currentTime+5);
  }else if(e.code==='ArrowLeft'&&activeEngine==='audius'){
    aud.currentTime=Math.max(0,aud.currentTime-5);
  }
});

if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>$('#pp').click());
  navigator.mediaSession.setActionHandler('pause',()=>$('#pp').click());
  navigator.mediaSession.setActionHandler('nexttrack',()=>nextTrack(false));
  navigator.mediaSession.setActionHandler('previoustrack',()=>prevTrack());
}

renderSubControls();
loadAudiusTrending('All');
</script>
