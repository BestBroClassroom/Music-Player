<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Audio Player</title>
<style>
:root{--bg:#1c1830;--sf:#272142;--ln:#3a3260;--tx:#f3effa;--mu:#a79fc4;--ac:#ffb347}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:20px 16px}
button,select{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:820px;margin:auto}
#f{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
#q,#key,#chan{flex:1;min-width:180px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:11px 14px;color:var(--tx);font:inherit}
#f button,#ks{background:var(--ac);color:#201400;border-radius:10px;padding:11px 18px;font-weight:600}
#f .ghost{background:none;color:var(--mu);border:1px solid var(--ln);padding:11px 13px}
#set{margin-bottom:14px;padding:14px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;display:grid;gap:10px}
.set-row{display:flex;gap:8px;flex-wrap:wrap}
#set small{color:var(--mu);line-height:1.4}

#deck{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:14px;display:flex;gap:20px;align-items:center}
@media(max-width:680px){#deck{flex-direction:column;text-align:center}}
#art{width:160px;height:160px;flex:none;border-radius:12px;object-fit:cover;background:#120f20;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.info{flex:1;min-width:0;width:100%}
.badge{color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
#tt{font:700 23px/1.2 Georgia,serif;overflow-wrap:anywhere;margin:4px 0}
#mt{color:var(--mu);font-size:14px}

.scrub{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.scrub input,#vol{accent-color:var(--ac);cursor:pointer}
#seek{flex:1}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
@media(max-width:680px){.ctl{justify-content:center;flex-wrap:wrap}}
.btns{display:flex;align-items:center;gap:10px}
.btns button,#mut{width:40px;height:40px;border-radius:50%;font-size:16px;background:var(--bg);color:var(--tx)}
#pp{width:48px;height:48px;font-size:18px;background:var(--ac)!important;color:#201400!important}
.volbox{display:flex;align-items:center;gap:6px}
#vol{width:84px}

/* Compliant visible 200x200 YouTube frame (only shown when playing a YouTube source) */
#yt-wrap{width:200px;height:200px;flex:none;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--ln)}
#yt-wrap[hidden]{display:none}
#yt-wrap iframe{width:200px;height:200px;border:0}

#st{color:var(--mu);font-size:13px;min-height:1.3em;margin-bottom:8px}
.row{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.row:hover,.row.active{background:var(--sf)}
.row img{width:48px;height:48px;object-fit:cover;border-radius:6px;flex:none;background:var(--bg)}
.row div{min-width:0;flex:1}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mu)}
.msg{color:var(--mu);padding:16px 6px}
</style>
</head>
<body>
<div class="app">
  <form id="f">
    <input id="q" placeholder="Search a song or artist…" autocomplete="off" autofocus>
    <button type="submit">Search</button>
    <button type="button" id="gear" class="ghost" title="Source Settings" aria-label="Source Settings">⚙</button>
  </form>

  <div id="set" hidden>
    <div class="set-row">
      <input id="key" type="password" placeholder="YouTube Data API v3 key (leave blank for keyless Audius audio)" autocomplete="off">
      <select id="chan" aria-label="YouTube Channel Filter">
        <option value="lyric_query">YouTube: Lyric & Audio Uploads (Recommended)</option>
        <option value="UCNqFDjYTexJdet3rPDrmJKg">Channel: 7clouds (Lyric Videos)</option>
        <option value="UC-9-kyTW8ZkZNDHQJ6FgpwQ">Channel: Music Topic / General</option>
        <option value="all">YouTube: All Embeddable Videos</option>
      </select>
      <button type="button" id="ks">Save</button>
    </div>
    <small>
      • <b>No API key:</b> Searches and plays direct audio streams from <b>Audius</b> (native &lt;audio&gt;, zero iframe errors).<br>
      • <b>With a YouTube Data API v3 key:</b> Searches embeddable lyric uploads or a specific lyric channel and plays via a compliant visible 200×200 player.
    </small>
  </div>

  <div id="deck" hidden>
    <img id="art" alt="Cover art">
    <div class="info">
      <span class="badge" id="badge">Now playing</span>
      <h1 id="tt"></h1>
      <p id="mt"></p>
      <div class="scrub">
        <span id="t0">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="t1">0:00</span>
      </div>
      <div class="ctl">
        <div class="btns">
          <button id="pv" aria-label="Previous">⏮</button>
          <button id="pp" aria-label="Play or pause">▶</button>
          <button id="nt" aria-label="Next">⏭</button>
        </div>
        <div class="volbox">
          <button id="mut" aria-label="Mute or unmute">🔊</button>
          <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
        </div>
      </div>
    </div>
    <div id="yt-wrap" hidden><div id="yt"></div></div>
  </div>

  <div id="st"></div>
  <div id="ls"></div>
</div>

<audio id="aud" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};

let ytKey=LS.get('yt_key','');
let ytChan=LS.get('yt_chan','lyric_query');
$('#key').value=ytKey;
$('#chan').value=ytChan;

let audiusHost='https://discoveryprovider.audius.co';
let ytPlayer=null,ytReady=0,ytPending=null;
let tracks=[],idx=-1,drag=0,activeEngine='audius';

const aud=$('#aud');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>s>=0?(s/60|0)+':'+String(s%60|0).padStart(2,'0'):'0:00';
const dec=s=>{const e=document.createElement('textarea');e.innerHTML=s;return e.value};

/* ---- Discover fastest healthy Audius node ---- */
(async()=>{
  try{
    const r=await fetch('https://api.audius.co',{signal:AbortSignal.timeout(4000)});
    const d=await r.json();
    if(Array.isArray(d.data)&&d.data[0])audiusHost=d.data[0];
  }catch{}
})();

/* ---- Search Providers (Single direct API call, zero retry loops) ---- */
async function searchAudius(q){
  const u=`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(q)}&limit=20&app_name=WebAudioPlayer`;
  const r=await fetch(u,{signal:AbortSignal.timeout(8000)});
  if(!r.ok)throw Error('Audius search error '+r.status);
  const d=await r.json();
  return (d.data||[]).filter(t=>t.is_streamable!==false).map(t=>({
    engine:'audius',
    id:t.id,
    title:t.title,
    artist:t.user?.name||'Unknown Artist',
    duration:t.duration||0,
    thumb:t.artwork?.['480x480']||t.artwork?.['150x150']||'',
    streamUrl:`${audiusHost}/v1/tracks/${t.id}/stream?app_name=WebAudioPlayer`
  }));
}

async function searchYouTube(q){
  const params={
    part:'snippet',
    type:'video',
    videoEmbeddable:'true',
    maxResults:'20',
    key:ytKey
  };
  if(ytChan==='lyric_query'){
    params.q=`${q} lyrics`;
  }else if(ytChan==='all'){
    params.q=q;
    params.videoCategoryId='10';
  }else{
    params.q=q;
    params.channelId=ytChan;
  }
  const u=new URL('https://www.googleapis.com/youtube/v3/search');
  u.search=new URLSearchParams(params);
  const r=await fetch(u,{signal:AbortSignal.timeout(8000)});
  const d=await r.json();
  if(!r.ok)throw Error(d.error?.message||'YouTube API error '+r.status);
  return (d.items||[]).map(i=>({
    engine:'youtube',
    id:i.id.videoId,
    title:dec(i.snippet.title),
    artist:dec(i.snippet.channelTitle),
    duration:0,
    thumb:i.snippet.thumbnails?.high?.url||`https://i.ytimg.com/vi/${i.id.videoId}/hqdefault.jpg`
  }));
}

/* ---- UI Rendering ---- */
function renderList(){
  if(!tracks.length){
    $('#ls').innerHTML='<p class="msg">Search a song or artist above to start listening.</p>';
    return;
  }
  $('#ls').innerHTML=tracks.map((t,i)=>`
    <div class="row${i===idx?' active':''}" data-i="${i}">
      <img src="${esc(t.thumb)}" alt="">
      <div><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div>
      <small>${t.duration?fmt(t.duration):''}</small>
    </div>
  `).join('');
}

function stopAll(){
  aud.pause();
  aud.removeAttribute('src');
  if(ytReady&&ytPlayer?.stopVideo)ytPlayer.stopVideo();
}

function playAt(i){
  if(i<0||i>=tracks.length)return;
  idx=i;
  const t=tracks[i];
  activeEngine=t.engine;
  stopAll();

  $('#deck').hidden=false;
  $('#art').src=t.thumb||'';
  $('#tt').textContent=t.title;
  $('#mt').textContent=t.artist;
  $('#t0').textContent='0:00';
  $('#t1').textContent=fmt(t.duration||0);
  $('#seek').value=0;
  $('#st').textContent='';
  renderList();

  if(t.engine==='audius'){
    $('#yt-wrap').hidden=true;
    $('#badge').textContent='Audius Stream';
    aud.src=t.streamUrl;
    aud.volume=+$('#vol').value/100;
    aud.play().catch(()=>{ $('#badge').textContent='Press ▶ to play'; });
  }else{
    $('#yt-wrap').hidden=false;
    $('#badge').textContent='YouTube Embed';
    if(ytReady){
      ytPlayer.loadVideoById(t.id);
      ytPlayer.setVolume(+$('#vol').value);
      ytPlayer.playVideo();
    }else{
      ytPending=t.id;
    }
  }
}

/* ---- Native HTML5 <audio> Events ---- */
aud.onplay=()=>{ $('#pp').textContent='⏸'; $('#badge').textContent='Now playing'; };
aud.onpause=()=>{ $('#pp').textContent='▶'; if(!aud.ended)$('#badge').textContent='Paused'; };
aud.onended=()=>{ if(idx+1<tracks.length)playAt(idx+1); };
aud.onerror=()=>{ $('#st').textContent='This stream failed to load. Click another track.'; };
aud.ontimeupdate=()=>{
  if(activeEngine!=='audius'||drag||!aud.duration)return;
  $('#seek').value=Math.round((aud.currentTime/aud.duration)*1000);
  $('#t0').textContent=fmt(aud.currentTime);
  $('#t1').textContent=fmt(aud.duration);
};

/* ---- Official YouTube IFrame API (Compliant visible 200x200 player) ---- */
window.onYouTubeIframeAPIReady=()=>{
  const pv={autoplay:1,playsinline:1,rel:0,enablejsapi:1};
  if(location.origin.startsWith('http'))pv.origin=location.origin;
  ytPlayer=new YT.Player('yt',{width:'200',height:'200',playerVars:pv,events:{
    onReady(){
      const ifr=ytPlayer.getIframe?.();
      if(ifr)ifr.referrerPolicy='strict-origin-when-cross-origin';
      ytReady=1;
      if(ytPending){ytPlayer.loadVideoById(ytPending);ytPending=null;}
    },
    onStateChange(e){
      if(activeEngine!=='youtube')return;
      $('#pp').textContent=e.data===1?'⏸':'▶';
      if(e.data===1){
        $('#badge').textContent='Now playing';
        const d=ytPlayer.getDuration()|0;
        if(d&&tracks[idx]){tracks[idx].duration=d;$('#t1').textContent=fmt(d);renderList();}
      }else if(e.data===2){
        $('#badge').textContent='Paused';
      }else if(e.data===0&&idx+1<tracks.length){
        playAt(idx+1);
      }
    },
    onError(e){
      // Single clean notice—no infinite search or skip loop
      $('#badge').textContent='Embed disabled';
      $('#st').textContent=`Uploader disabled embedding on this video (Error ${e.data}). Pick another result below.`;
    }
  }});
};
const ys=document.createElement('script');
ys.src='https://www.youtube.com/iframe_api';
document.head.append(ys);

setInterval(()=>{
  if(activeEngine!=='youtube'||!ytReady||drag||ytPlayer.getPlayerState?.()!==1)return;
  const c=ytPlayer.getCurrentTime()||0,d=ytPlayer.getDuration()||0;
  if(d>0){$('#seek').value=Math.round((c/d)*1000);$('#t0').textContent=fmt(c);$('#t1').textContent=fmt(d);}
},300);

/* ---- Transport, Scrubber & Volume ---- */
$('#seek').oninput=()=>{
  drag=1;
  const d=activeEngine==='audius'?(aud.duration||0):(ytReady?ytPlayer.getDuration()||0:0);
  $('#t0').textContent=fmt(($('#seek').value/1000)*d);
};
$('#seek').onchange=()=>{
  const pct=$('#seek').value/1000;
  if(activeEngine==='audius'&&aud.duration)aud.currentTime=pct*aud.duration;
  else if(activeEngine==='youtube'&&ytReady)ytPlayer.seekTo(pct*(ytPlayer.getDuration()||0),true);
  drag=0;
};
$('#pp').onclick=()=>{
  if(activeEngine==='audius'){
    aud.paused?aud.play():aud.pause();
  }else if(ytReady){
    ytPlayer.getPlayerState()===1?ytPlayer.pauseVideo():ytPlayer.playVideo();
  }
};
$('#pv').onclick=()=>{
  if(activeEngine==='audius'&&aud.currentTime>3){aud.currentTime=0;return;}
  if(activeEngine==='youtube'&&ytReady&&ytPlayer.getCurrentTime()>3){ytPlayer.seekTo(0);return;}
  if(idx>0)playAt(idx-1);
};
$('#nt').onclick=()=>{ if(idx+1<tracks.length)playAt(idx+1); };
$('#vol').oninput=()=>{
  const v=+$('#vol').value;
  aud.volume=v/100;aud.muted=v===0;
  if(ytReady){ytPlayer.unMute();ytPlayer.setVolume(v);}
  $('#mut').textContent=v===0?'🔇':'🔊';
};
$('#mut').onclick=()=>{
  if(activeEngine==='audius'){
    aud.muted=!aud.muted;
    $('#mut').textContent=aud.muted?'🔇':'🔊';
  }else if(ytReady){
    if(ytPlayer.isMuted()){ytPlayer.unMute();$('#mut').textContent='🔊';}
    else{ytPlayer.mute();$('#mut').textContent='🔇';}
  }
};

/* ---- Search & Settings ---- */
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const q=$('#q').value.trim();
  if(!q)return;
  $('#st').textContent=ytKey?'Searching YouTube…':'Searching Audius…';
  try{
    tracks=ytKey?await searchYouTube(q):await searchAudius(q);
    idx=-1;
    renderList();
    $('#st').textContent=tracks.length?'':'No tracks found.';
    if(tracks[0])playAt(0);
  }catch(err){
    $('#st').textContent=err.message;
  }
};
$('#ls').onclick=e=>{
  const r=e.target.closest('.row');
  if(r)playAt(+r.dataset.i);
};
$('#gear').onclick=()=>$('#set').hidden=!$('#set').hidden;
$('#ks').onclick=()=>{
  ytKey=$('#key').value.trim();
  ytChan=$('#chan').value;
  LS.set('yt_key',ytKey);
  LS.set('yt_chan',ytChan);
  $('#set').hidden=true;
  $('#st').textContent=ytKey?'Using YouTube Data API v3.':'Using keyless Audius audio streams.';
};

renderList();
</script>
</body>
</html>
